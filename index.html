<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #0f0f1a 100%);
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }

  /* 动态背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(231,76,60,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 600px 400px at 80% 90%, rgba(46,204,113,0.08) 0%, transparent 50%),
      radial-gradient(ellipse 400px 300px at 20% 80%, rgba(52,152,219,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    animation: ambient-pulse 8s ease-in-out infinite;
  }

  @keyframes ambient-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  /* 网格背景纹理 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.2);
    margin-bottom: 40px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255,255,255,0.1);
  }

  /* 标签页优化 */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 5px;
    margin-bottom: 48px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 4px 24px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
  }
  .tab {
    padding: 10px 32px;
    border-radius: 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: rgba(255,255,255,0.4);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    background: transparent;
    font-weight: 500;
    letter-spacing: 1.5px;
    position: relative;
    overflow: hidden;
  }
  .tab::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .tab:hover {
    color: rgba(255,255,255,0.8);
  }
  .tab:hover::before {
    opacity: 1;
  }
  .tab.active {
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
    color: #fff;
    box-shadow:
      0 2px 12px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }

  /* 计时器圆环优化 */
  .timer-ring {
    position: relative;
    width: 320px;
    height: 320px;
    margin-bottom: 48px;
  }

  .timer-ring::before {
    content: '';
    position: absolute;
    inset: -20px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
  }

  .timer-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    filter: drop-shadow(0 0 30px rgba(231,76,60,0.25));
    transition: filter 0.5s ease;
  }

  .timer-ring.break svg {
    filter: drop-shadow(0 0 30px rgba(46,204,113,0.25));
  }

  /* 外圈光晕动画 */
  .timer-ring::after {
    content: '';
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid transparent;
    animation: rotate-glow 3s linear infinite;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .timer-ring.running::after {
    opacity: 0.5;
  }

  @keyframes rotate-glow {
    0% { transform: rotate(0deg); border-color: rgba(231,76,60,0.3) rgba(231,76,60,0.1) rgba(231,76,60,0.1) rgba(231,76,60,0.1); }
    100% { transform: rotate(360deg); border-color: rgba(231,76,60,0.3) rgba(231,76,60,0.1) rgba(231,76,60,0.1) rgba(231,76,60,0.1); }
  }

  .timer-ring.break.running::after {
    border-color: rgba(46,204,113,0.3) rgba(46,204,113,0.1) rgba(46,204,113,0.1) rgba(46,204,113,0.1);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.03);
    stroke-width: 6;
  }

  .ring-progress {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 8px currentColor);
  }

  /* 时间显示优化 */
  .timer-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100%;
  }

  .time {
    font-size: 5rem;
    font-weight: 100;
    letter-spacing: 6px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.15));
    transition: all 0.3s ease;
  }

  .time.running {
    animation: pulse-text 2s ease-in-out infinite;
  }

  @keyframes pulse-text {
    0%, 100% {
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.15));
      transform: scale(1);
    }
    50% {
      filter: drop-shadow(0 0 30px rgba(255,255,255,0.25));
      transform: scale(1.01);
    }
  }

  .mode-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    margin-top: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    transition: all 0.4s ease;
  }

  /* 控制按钮优化 */
  .controls {
    display: flex;
    gap: 24px;
    align-items: center;
    margin-bottom: 48px;
  }

  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.15), transparent 70%);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .btn:hover::before {
    opacity: 1;
  }

  .btn:hover {
    border-color: rgba(255,255,255,0.25);
    color: #fff;
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .btn:active {
    transform: translateY(0) scale(0.95);
  }

  .btn-primary {
    width: 84px;
    height: 84px;
    border: 2px solid rgba(231,76,60,0.4);
    background: linear-gradient(135deg, rgba(231,76,60,0.15), rgba(231,76,60,0.05));
    color: #fff;
    box-shadow:
      0 0 40px rgba(231,76,60,0.15),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, rgba(231,76,60,0.25), rgba(231,76,60,0.1));
    border-color: rgba(231,76,60,0.6);
    box-shadow:
      0 0 60px rgba(231,76,60,0.25),
      inset 0 1px 0 rgba(255,255,255,0.15);
    transform: translateY(-3px) scale(1.08);
  }

  .btn-primary.break-mode {
    border-color: rgba(46,204,113,0.4);
    background: linear-gradient(135deg, rgba(46,204,113,0.15), rgba(46,204,113,0.05));
    box-shadow:
      0 0 40px rgba(46,204,113,0.15),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .btn-primary.break-mode:hover {
    background: linear-gradient(135deg, rgba(46,204,113,0.25), rgba(46,204,113,0.1));
    border-color: rgba(46,204,113,0.6);
    box-shadow:
      0 0 60px rgba(46,204,113,0.25),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }

  /* 番茄计数器优化 */
  .pomodoro-count {
    display: flex;
    align-items: center;
    gap: 16px;
    color: rgba(255,255,255,0.25);
    font-size: 0.75rem;
    letter-spacing: 1px;
    padding: 12px 24px;
    background: rgba(255,255,255,0.02);
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .tomato-dots {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }

  .dot::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .dot.done {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    border-color: rgba(231,76,60,0.4);
    box-shadow:
      0 0 16px rgba(231,76,60,0.35),
      inset 0 1px 0 rgba(255,255,255,0.2);
    font-size: 13px;
    animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .dot.done::after {
    opacity: 1;
  }

  .dot.done::before {
    content: '🍅';
    font-size: 12px;
    position: absolute;
    z-index: 1;
  }

  @keyframes pop-in {
    0% { transform: scale(0) rotate(-180deg); }
    50% { transform: scale(1.2) rotate(10deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* 响应式设计 */
  @media (max-width: 480px) {
    .timer-ring {
      width: 260px;
      height: 260px;
    }

    .time {
      font-size: 3.5rem;
      letter-spacing: 3px;
    }

    .tab {
      padding: 8px 24px;
    }

    .controls {
      gap: 16px;
    }

    .btn {
      width: 44px;
      height: 44px;
    }

    .btn-primary {
      width: 72px;
      height: 72px;
    }
  }

  /* SVG 渐变定义 */
  .gradient-defs {
    position: absolute;
    width: 0;
    height: 0;
    pointer-events: none;
    opacity: 0;
  }
</style>
</head>
<body>

<div class="gradient-defs">
  <svg>
    <defs>
      <linearGradient id="workGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#e74c3c">
          <animate attributeName="stop-color" values="#e74c3c;#f39c12;#e74c3c" dur="3s" repeatCount="indefinite" />
        </stop>
        <stop offset="100%" stop-color="#f39c12">
          <animate attributeName="stop-color" values="#f39c12;#e74c3c;#f39c12" dur="3s" repeatCount="indefinite" />
        </stop>
      </linearGradient>
      <linearGradient id="breakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2ecc71">
          <animate attributeName="stop-color" values="#2ecc71;#1abc9c;#2ecc71" dur="3s" repeatCount="indefinite" />
        </stop>
        <stop offset="100%" stop-color="#1abc9c">
          <animate attributeName="stop-color" values="#1abc9c;#2ecc71;#1abc9c" dur="3s" repeatCount="indefinite" />
        </stop>
      </linearGradient>
    </defs>
  </svg>
</div>

<div class="container">

<h1>番茄钟</h1>

<div class="tabs">
  <button class="tab active" onclick="switchMode('work')">专注</button>
  <button class="tab" onclick="switchMode('break')">休息</button>
</div>

<div class="timer-ring" id="timerRing">
  <svg viewBox="0 0 320 320">
    <circle class="ring-bg" cx="160" cy="160" r="145"/>
    <circle class="ring-progress" id="progressRing" cx="160" cy="160" r="145"
      stroke-dasharray="911.06" stroke-dashoffset="0" stroke="url(#workGrad)"/>
  </svg>
  <div class="timer-display">
    <div class="time" id="timeDisplay">25:00</div>
    <div class="mode-label" id="modeLabel">专注模式</div>
  </div>
</div>

<div class="controls">
  <button class="btn" onclick="reset()" title="重置">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
    </svg>
  </button>
  <button class="btn btn-primary" id="playBtn" onclick="toggle()" title="开始">
    <svg width="28" height="28" fill="currentColor" id="playIcon">
      <polygon points="10,8 26,16 10,24"/>
    </svg>
  </button>
  <button class="btn" onclick="skip()" title="跳过">
    <svg width="20" height="20" fill="currentColor">
      <polygon points="5,4 15,10 5,16"/>
      <polygon points="13,4 23,10 13,16"/>
    </svg>
  </button>
</div>

<div class="pomodoro-count">
  <span>今日完成</span>
  <div class="tomato-dots" id="dots"></div>
</div>

</div>

<script>
const WORK = 25 * 60;
const BREAK = 5 * 60;
const CIRCUMFERENCE = 2 * Math.PI * 145;

let mode = 'work';
let totalSeconds = WORK;
let remaining = WORK;
let running = false;
let interval = null;
let pomodoroDone = 0;

const ring = document.getElementById('progressRing');
const timerRing = document.getElementById('timerRing');
const timeDisplay = document.getElementById('timeDisplay');
const modeLabel = document.getElementById('modeLabel');
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const dots = document.getElementById('dots');

function loadCount() {
  const key = 'pomodoro_' + new Date().toISOString().slice(0, 10);
  pomodoroDone = parseInt(localStorage.getItem(key) || '0', 10);
  renderDots();
}

function saveCount() {
  const key = 'pomodoro_' + new Date().toISOString().slice(0, 10);
  localStorage.setItem(key, pomodoroDone);
}

function renderDots() {
  const target = Math.max(pomodoroDone + 1, 1);
  dots.innerHTML = '';
  for (let i = 0; i < target; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i < pomodoroDone ? ' done' : '');
    dots.appendChild(d);
  }
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function updateRing() {
  const fraction = remaining / totalSeconds;
  ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
}

function render() {
  timeDisplay.textContent = formatTime(remaining);
  document.title = formatTime(remaining) + ' | 番茄钟';
  updateRing();
}

function toggle() {
  if (running) pause();
  else start();
}

function start() {
  running = true;
  timeDisplay.classList.add('running');
  timerRing.classList.add('running');
  playIcon.innerHTML = '<rect x="10" y="6" width="6" height="20" rx="1.5"/><rect x="19" y="6" width="6" height="20" rx="1.5"/>';
  interval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      remaining = 0;
      render();
      onComplete();
      return;
    }
    render();
  }, 1000);
}

function pause() {
  running = false;
  timeDisplay.classList.remove('running');
  timerRing.classList.remove('running');
  playIcon.innerHTML = '<polygon points="10,8 26,16 10,24"/>';
}

function reset() {
  pause();
  remaining = totalSeconds;
  render();
  document.title = '番茄钟';
}

function onComplete() {
  pause();
  notify();
  beep();

  if (mode === 'work') {
    pomodoroDone++;
    saveCount();
    renderDots();
    switchMode('break');
  } else {
    switchMode('work');
  }
}

function switchMode(m) {
  pause();
  mode = m;
  totalSeconds = m === 'work' ? WORK : BREAK;
  remaining = totalSeconds;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.textContent.trim() === (m === 'work' ? '专注' : '休息'));
  });
  ring.setAttribute('stroke', 'url(#' + (m === 'work' ? 'workGrad' : 'breakGrad') + ')');
  timerRing.className = 'timer-ring' + (m === 'break' ? ' break' : '');
  playBtn.className = 'btn btn-primary' + (m === 'break' ? ' break-mode' : '');
  modeLabel.textContent = m === 'work' ? '专注模式' : '休息模式';
  playIcon.innerHTML = '<polygon points="10,8 26,16 10,24"/>';
  document.title = '番茄钟';

  render();
}

function skip() {
  onComplete();
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);

    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value = 1108;
    osc2.type = 'sine';
    gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.15);
    gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.55);
    osc2.start(ctx.currentTime + 0.15);
    osc2.stop(ctx.currentTime + 0.55);
  } catch (_) {}
}

function notify() {
  if (Notification.permission === 'granted') {
    new Notification('番茄钟', {
      body: mode === 'work' ? '专注结束，休息一下吧！' : '休息结束，继续加油！',
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">&#127813;</text></svg>'
    });
  }
}

if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

loadCount();
render();
</script>
</body>
</html>
